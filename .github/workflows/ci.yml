name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fmt:
    name: Format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check

  clippy:
    name: Clippy
    if: github.event_name == 'pull_request'
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - run: cargo clippy --all-targets --quiet -- -D warnings

  test:
    name: Test
    if: github.event_name == 'pull_request'
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - run: cargo test --quiet

  audit:
    name: Audit
    if: github.event_name == 'pull_request'
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --deny yanked --quiet

  coverage:
    name: Coverage
    if: github.event_name == 'pull_request'
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: |
          cargo llvm-cov --lib --summary-only --quiet \
            --ignore-filename-regex "(ui/|utils/updater|utils/build_info|tick_events|history/|deep/discovery|deep/persistence|enhancement/logic|enhancement/persistence|stormglass/earning|stormglass/spending|stormglass/types)" \
            --fail-under-lines 90

  ci-pass:
    name: Check & Test
    if: always() && github.event_name == 'pull_request'
    needs: [fmt, clippy, test, audit, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          results=("${{ needs.fmt.result }}" "${{ needs.clippy.result }}" "${{ needs.test.result }}" "${{ needs.audit.result }}" "${{ needs.coverage.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "One or more CI jobs failed"
              exit 1
            fi
          done
          echo "All CI checks passed"

  build:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: quest
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: quest
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: quest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          # Extract short commit (7 chars)
          export BUILD_COMMIT="${BUILD_COMMIT:0:7}"
          # Extract date from timestamp (YYYY-MM-DD)
          export BUILD_DATE="${BUILD_DATE:0:10}"
          cargo build --release --target ${{ matrix.target }}

      - name: Sign binary (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign -s - -f target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../quest-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quest-${{ matrix.target }}
          path: quest-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.ref_name }}@${{ github.sha }}
          body: "Automated build from commit ${{ github.sha }}"
          files: artifacts/*
