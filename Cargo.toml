[package]
name = "quest"
version = "0.1.0"
edition = "2021"
default-run = "quest"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
chess-engine = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rand = "0.10"
dirs = "6.0"
uuid = { version = "1.23", features = ["v4"] }
ureq = { version = "3.3", features = ["json"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-openssl", "https"] }
rand_chacha = "0.10"
unicode-width = "0.2"
petgraph = "0.8"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
insta = { version = "1", features = ["filters"] }

# rand_chacha moved to [dependencies] for the simulator binary

# updater.rs uses tar+flate2 on non-Windows and zip on Windows to extract
# release archives; each is only ever compiled for its own platform.
[target.'cfg(not(target_os = "windows"))'.dependencies]
flate2 = "1.1"
tar = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
zip = { version = "8.5", default-features = false, features = ["deflate"] }

[lints.rust]
unused_imports = "deny"

[profile.dev]
# "unpacked" skips the slow dsymutil pass on macOS, speeding up linking
split-debuginfo = "unpacked"

[profile.dev.package."*"]
# Optimize third-party dependencies even in dev builds — they rarely
# change, and optimized code runs faster (matters for game tick tests).
opt-level = 2

[profile.test]
# More codegen units = more parallelism during code generation.
# Trade-off: slightly larger binaries, but faster compile times.
codegen-units = 256
# "line-tables-only" emits enough debug info for backtraces but skips
# variable/type info, reducing debug section size and link time.
debug = "line-tables-only"
# Skip dsymutil on macOS for test binaries too (matches [profile.dev]).
split-debuginfo = "unpacked"

[profile.test.package."*"]
opt-level = 2

[[bench]]
name = "game_tick"
harness = false
